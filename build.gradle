plugins {
    id 'java-library'
    id 'maven-publish'
    id "org.hidetake.ssh" version "2.11.2"
    id 'war'
    id 'java'
}
group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}
dependencies {
    implementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    implementation 'org.junit.jupiter:junit-jupiter-api:5.11.0'
    implementation 'org.junit.jupiter:junit-jupiter-engine:5.11.0'

    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.1'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

    implementation 'mysql:mysql-connector-java:8.0.33'

    implementation 'com.mysql:mysql-connector-j:9.1.0'

    implementation 'org.jdbi:jdbi3-core:3.47.0'

    implementation 'com.sun.mail:javax.mail:1.6.2'

    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'io.github.cdimascio:java-dotenv:5.2.2'

    implementation 'org.json:json:20210307'
}

ext {
    junitVersion = '5.11.0'
}
test {
    useJUnitPlatform()
}
sourceCompatibility = '11'
targetCompatibility = '11'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly('jakarta.servlet:jakarta.servlet-api:6.1.0')
    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}


apply plugin: 'org.hidetake.ssh'
remotes {
    host {
        host = '192.168.124.133'
        user = 'root'
        password = '123'
    }
}
ssh.settings {
    knownHosts = allowAnyHosts
}
task docker_app_start {
    doLast {
        println 'begin docker_app_start'
        ssh.run {
            session(remotes.host) {
                execute 'docker stop tomcat10', ignoreError: true
                execute 'docker run -it --rm -d ' +
                        '--name tomcat10' +
                        '-v /usr/deploy:/usr/local/tomcat/webapps ' +
                        '-p 80:8080 ' +
                        'tomcat:10.0&'
            }
        }
    }
}
task docker_upload_file_to_server {
    doLast {
        println 'Uploading file to Linux server...'
        ssh.run {
            session(remotes.host) {
                // Tạo thư mục nếu chưa có
                execute 'mkdir -p /usr/deploy'

                // Xóa file cũ nếu có
                remove '/usr/deploy/cnpm.war'
                remove '/usr/deploy/cnpm'
                // Upload file
                put from: "${project.projectDir}/build/libs/demo-1.0-SNAPSHOT.war",
                        into: "/usr/deploy/cnpm.war"
            }
        }
    }
}

task docker_deploy {
    docker_deploy.dependsOn docker_app_start
    docker_deploy.dependsOn docker_upload_file_to_server
    docker_deploy.dependsOn build
    tasks.getByName('docker_app_start').mustRunAfter docker_upload_file_to_server
}
